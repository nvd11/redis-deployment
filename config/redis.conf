# ============================================================
# Redis 规范化配置模板
# 适用: 单机实验/生产环境 (Debian/Ubuntu)
# 特性: 混合持久化 (RDB+AOF) / 密码认证 / 仅本地绑定
# 注意: install.sh 会替换 port/requirepass 字段
# ============================================================

# --- 基础 ---
bind 127.0.0.1 -::1
protected-mode yes
port 6379
daemonize no
supervised systemd
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log

# --- 安全: 密码 (install.sh 注入) ---
requirepass changeme

# --- 网络超时/保活 ---
timeout 0
tcp-keepalive 300

# --- 通用配置 ---
databases 16
always-show-logo no

# --- 持久化: 混合模式 (RDB 快照 + AOF 增量) ---
# AOF 开启，每秒刷盘，最多丢 1 秒数据
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
aof-timestamp-enabled no

# RDB 快照策略
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

# --- 内存管理 ---
# 实验环境可注释 maxmemory，让 Redis 吃机器内存
# 生产环境建议设置并配置淘汰策略:
# maxmemory 512mb
# maxmemory-policy allkeys-lru
maxmemory-policy noeviction

# --- 性能调优 ---
tcp-backlog 511
maxclients 10000

# --- 慢查询日志 ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- 高级配置 (保持默认) ---
hash-max-listpack-entries 128
hash-max-listpack-value 64
list-max-listpack-size 128
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64
hz 10
dynamic-hz yes
