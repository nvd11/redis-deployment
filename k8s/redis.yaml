# ============================================================
# Redis on K3s (Kubernetes) — 当前生产方案
# ============================================================
# 目标: 部署到 K3s 集群的 OCI free-arm-vm worker 节点
# 网络: ClusterIP Service 暴露 6379, 经 Kong Gateway L4 Stream 对外
#       (客户端 -> Kong :6379 -> TCPIngress -> redis Service -> redis Pod)
#       不再使用 hostNetwork 直绑节点端口 (避免与 Kong 6379 冲突)
# 持久化: local-path PVC (K3s 自带存储类, 数据落 free-arm-vm 本地磁盘)
#
# 用法:
#   kubectl apply -f k8s/redis.yaml
#   kubectl -n redis get pods -o wide   # 确认调度到 free-arm-vm
#   kubectl -n redis get svc            # redis ClusterIP Service
#
# 验证 (经 Kong Gateway, 从集群外):
#   redis-cli -h <节点TailscaleIP> -p 6379 -a <PASSWORD> ping
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: redis
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: redis
type: Opaque
# ============================================================
# 密码管理说明 (重要)
# - 这里用 stringData 写的是【占位符】, API server 部署时自动
#   转成 data (base64) 存储, 集群里只有 data, 没有 stringData
# - 真实密码不在 Git 里, 通过 kubectl patch 注入集群 etcd:
#     kubectl -n redis patch secret redis-secret --type merge \
#       -p '{"data":{"redis-password":"$(echo -n 真密码 | base64)"}}'
# - ArgoCD 的 redis app 已配置 ignoreDifferences /data
#   (见 my-argocd-manifests/argocd-apps/redis-app.yaml),
#   selfHeal 不会把 data 拉回占位符
# - 换密码: patch Secret 后必须 rollout restart deploy/redis
#   (env 注入只在 pod 创建时生效, 不热更新)
# ============================================================
stringData:
  redis-password: CHANGE_ME
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: redis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # 钉在 OCI ARM worker，避免调度到其他架构节点
      nodeSelector:
        kubernetes.io/hostname: free-arm-vm
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --requirepass
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# ============================================================
# Kong TCPIngress: 把 Kong Gateway 的 6379 L4 Stream 流量
# 转发到 Redis ClusterIP Service
# ============================================================
apiVersion: configuration.konghq.com/v1beta1
kind: TCPIngress
metadata:
  name: redis-tcp
  namespace: redis
  annotations:
    kubernetes.io/ingress.class: kong
spec:
  rules:
    - port: 6379
      backend:
        serviceName: redis
        servicePort: 6379
